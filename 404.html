<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>医学统计学 · 互动课堂</title>
<style>
:root{--blue:#17699b;--ink:#243e54;--muted:#455d72;--line:#c5d3df;--bg:#f4f7fb;--purple:#6b55a2;--purple-pale:#f0ecf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.masthead{background:linear-gradient(115deg,#17699b,#155d89);color:#fff;text-align:center;padding:30px 20px 34px}
.eyebrow{font-size:12px;letter-spacing:2px;color:#eef7ff}
h1{font-size:34px;margin:6px 0 8px;font-weight:650}p{margin:0;color:#f2f8ff}
.shell{max-width:900px;margin:auto;padding:34px 24px}
a.tile{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin-bottom:18px;text-decoration:none;color:var(--ink);box-shadow:0 4px 18px #163b5a05;transition:transform .12s}
a.tile:hover{transform:translateY(-2px);border-color:var(--blue)}
.tile h2{margin:0 0 4px;font-size:20px;color:var(--blue)}
.tile .tag{font-size:12.5px;color:var(--purple);background:var(--purple-pale);border-radius:20px;padding:2px 12px;display:inline-block;margin-bottom:6px}
.tile p{color:var(--muted);font-size:14.5px}

.dept-sign{font-family:"Kaiti SC","STKaiti","KaiTi","楷体","KaiTi_GB2312",serif;letter-spacing:1.2px}
.hero-sign{margin-top:14px;font-size:15px;color:#e8f3fb;font-weight:600}
.footer-sign{font-family:"Kaiti SC","STKaiti","KaiTi","楷体","KaiTi_GB2312",serif;font-size:15px;color:#14577f;letter-spacing:1.2px;font-weight:600;text-align:center;padding:18px 0 30px;border-top:1px solid #dbe6ef;margin-top:10px}
</style></head>
<body>
<header class="masthead"><div class="eyebrow">医学统计学 · 随机练习 + 分布互动</div><h1>互动课堂</h1><p>两个课堂入口，均可直接在浏览器中使用</p>
<div class="dept-sign hero-sign">中南大学 湘雅公共卫生学院 流行病与卫生统计学系</div></header>
<main class="shell">
<a class="tile" href="distributions.html"><span class="tag">分布 · 界值表 · 假设检验原理</span><h2>统计分布互动课堂</h2><p>正态、t、F、χ²、二项、泊松、多元正态、logit 分布；拖动滑块联动曲线、界值表与拒绝域，含假设检验原理实验台。</p></a>
<a class="tile" href="survival.html"><span class="tag">生存分析 · 随机练习课堂</span><h2>生存分析互动课堂</h2><p>Kaplan-Meier 生存曲线、Log-rank 检验实时判题、Cox 回归结果解读，「继续想一想」追问链与综合分析题（衔接已学回归）。</p></a>
</main>
<div class="dept-sign footer-sign">中南大学 湘雅公共卫生学院 流行病与卫生统计学系</div></body></html>
